<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fleet admin · vercel.school</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg:#F7F7F5; --tray:#EEEEEA; --card:#fff; --dark:#0F0F12; --ink:#141416; --mute:#8B8B87; --line:#E6E6E1;
    --accent:#2F5BFF; --tint:#EEF2FF; --good:#12924F; --warn:#C27A00; --bad:#D4372C;
    --shadow:0 1px 2px rgba(20,20,22,.05), 0 8px 24px -12px rgba(20,20,22,.14);
    --spring:cubic-bezier(.34,1.56,.64,1); --soft:cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-feature-settings:"tnum","cv11","ss01"; letter-spacing:-.006em; -webkit-font-smoothing:antialiased; }
  main { max-width:1240px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0; letter-spacing:-.02em; }
  p { margin:0; }
  a { color:inherit; text-decoration:none; } a:hover { text-decoration:underline; }
  .mute { color:var(--mute); }
  .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  button { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:7px 14px; cursor:pointer;
    transition:transform .2s var(--spring), background .2s; }
  button:active { transform:scale(.96); }
  button:focus-visible, a:focus-visible, th:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  code { background:var(--tray); padding:2px 6px; border-radius:6px; word-break:break-all; }

  .tray { background:var(--tray); border-radius:22px; padding:16px; transition:opacity .25s; }
  .tray.refreshing { opacity:.55; }
  .top { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:4px 6px 14px; }
  .top .mute { font-size:12px; display:inline-flex; align-items:center; gap:7px; }
  .pulse { width:7px; height:7px; border-radius:50%; background:var(--good); box-shadow:0 0 0 0 rgba(18,146,79,.5); animation:pulse 2.2s infinite; }
  .seg { display:flex; gap:4px; background:var(--card); padding:4px; border-radius:12px; box-shadow:var(--shadow); }
  .seg button { border:0; background:transparent; padding:6px 12px; border-radius:8px; color:var(--mute); }
  .seg button.on { background:var(--ink); color:#fff; }
  .seg .out { color:var(--ink); }

  .bento { display:grid; grid-template-columns:repeat(12, minmax(0, 1fr)); gap:10px; }
  .card { background:var(--card); border-radius:14px; padding:16px; box-shadow:var(--shadow); min-width:0; display:flex; flex-direction:column; gap:8px;
    animation:rise .7s var(--spring) both; animation-delay:calc(var(--i, 0) * 60ms); transition:transform .3s var(--spring), box-shadow .3s; }
  .card:hover { transform:translateY(-2px); box-shadow:0 1px 2px rgba(20,20,22,.05), 0 16px 32px -14px rgba(20,20,22,.22); }
  .card.dark { background:var(--dark); color:#fff; }
  .card.tint { background:var(--tint); }
  .card.solo { animation:none; }
  .label { margin:0; font-size:11px; font-weight:500; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
  .big { font-size:52px; line-height:1; font-weight:600; letter-spacing:-.04em; }
  .big.small { font-size:34px; }
  .tint .big { color:var(--accent); }
  .of { font-size:16px; color:var(--mute); font-weight:500; letter-spacing:0; }
  .sub { font-size:12px; color:var(--mute); }
  .sub b { color:var(--ink); }
  .hero { grid-column:span 5; } .search { grid-column:span 4; } .ringcard { grid-column:span 3; }
  .topsites { grid-column:span 5; } .sources { grid-column:span 4; } .noise { grid-column:span 3; }
  .attention { grid-column:span 5; } .scores { grid-column:span 7; } .tablecard { grid-column:span 12; }

  .spark { width:100%; height:72px; margin-top:auto; overflow:visible; }
  .spark .line { fill:none; stroke:var(--accent); stroke-width:2; vector-effect:non-scaling-stroke; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.4s var(--soft) .35s forwards; }
  .spark .area { fill:var(--accent); opacity:0; animation:fade .9s ease 1s forwards; --to:.16; }
  .spark .dot { fill:#fff; stroke:var(--accent); stroke-width:2; opacity:0; animation:fade .4s ease 1.6s forwards; --to:1; }
  .foot { display:flex; justify-content:space-between; font-size:11px; color:var(--mute); }

  .ringwrap { display:flex; align-items:center; gap:14px; margin:auto 0; }
  .ring { width:84px; height:84px; transform:rotate(-90deg); flex:none; }
  .ring circle { fill:none; stroke-width:9; }
  .ring .track { stroke:var(--tray); }
  .ring .fill { stroke:var(--accent); stroke-linecap:round; stroke-dashoffset:var(--full); animation:ring 1.2s var(--soft) .4s forwards; }

  .bars { list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:9px; }
  .bars li { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:3px 10px; font-size:13px; animation:rise .6s var(--spring) both; animation-delay:calc(240ms + var(--i, 0) * 50ms); }
  .bars .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bars .val { font-weight:600; }
  .rail { grid-column:1 / -1; height:5px; border-radius:3px; background:var(--tray); overflow:hidden; }
  .tint .rail { background:#dfe6ff; }
  .bar { display:block; height:100%; width:var(--w); border-radius:3px; background:var(--ink); transform-origin:left; animation:grow .9s var(--soft) both; animation-delay:calc(320ms + var(--i, 0) * 50ms); }
  .bar.accent { background:var(--accent); } .bar.good { background:var(--good); } .bar.warn { background:var(--warn); } .bar.bad { background:var(--bad); }

  .split { height:10px; border-radius:5px; background:var(--tray); overflow:hidden; margin:6px 0 2px; }
  .split span { display:block; height:100%; width:var(--w); background:var(--accent); border-radius:5px; transform-origin:left; animation:grow 1s var(--soft) .5s both; }

  .flags { list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; }
  .flags li { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid rgba(255,255,255,.09); font-size:13px;
    animation:rise .6s var(--spring) both; animation-delay:calc(300ms + var(--i, 0) * 60ms); }
  .flags li:first-child { border-top:0; }
  .flags a { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip { margin-left:auto; font-size:11px; padding:3px 8px; border-radius:20px; background:rgba(255,255,255,.1); color:#d6d6d2; white-space:nowrap; }
  .flags .val { font-weight:600; min-width:2ch; text-align:right; }

  .wrap { overflow-x:auto; margin:0 -6px; }
  table { border-collapse:collapse; width:100%; min-width:920px; font-size:13px; }
  th, td { padding:9px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child, td.l, th.l { text-align:left; }
  th { font-size:11px; font-weight:500; color:var(--mute); text-transform:uppercase; letter-spacing:.05em; cursor:pointer; user-select:none; }
  tbody tr { transition:background .15s; } tbody tr:hover { background:var(--bg); }
  tr:last-child td { border-bottom:0; }

  .center { max-width:420px; margin:18vh auto 0; text-align:center; }
  .center.card { padding:32px 24px; gap:14px; align-items:center; }

  @keyframes rise { from { opacity:0; transform:translateY(8px) scale(.94); } to { opacity:1; transform:none; } }
  @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes fade { to { opacity:var(--to, 1); } }
  @keyframes ring { to { stroke-dashoffset:var(--gap); } }
  @keyframes pulse { 70% { box-shadow:0 0 0 7px rgba(18,146,79,0); } 100% { box-shadow:0 0 0 0 rgba(18,146,79,0); } }

  @media (max-width:980px) {
    .hero, .search, .topsites, .sources, .attention, .scores { grid-column:span 6; }
    .ringcard, .noise { grid-column:span 6; }
  }
  @media (max-width:640px) {
    main { padding:8px; } .tray { padding:10px; border-radius:18px; }
    .bento > .card { grid-column:1 / -1; }
    .big { font-size:44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-delay:0s !important; transition:none !important; }
  }
</style>
</head>
<body>
<main id="root"><p class="mute center">Loading…</p></main>
<script src="/admin.js" defer></script>
</body>
</html>
